<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchParty — camera &amp; mic</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101014; color: #f4f3f2; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 380px; padding: 28px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9a97a2; margin: 0 0 18px; }
  button { border: 1px solid #c92534; background: linear-gradient(180deg, #ea4a58, #c92534); color: #fff; font: 600 14px system-ui, sans-serif; padding: 10px 18px; border-radius: 9px; cursor: pointer; }
  .ok { color: #55c986; }
  .err { color: #f0808b; }
</style>
</head>
<body>
<main>
  <h1>Allow camera &amp; mic</h1>
  <p id="msg">WatchParty runs in your browser's side panel, which can't ask for permission itself. Allow it once here and you're set.</p>
  <button id="go" type="button">Allow camera &amp; mic</button>
</main>
<script src="grant.js"></script>
</body>
</html>
